# regex-lab onto an iPhone: tag `regex-lab-v<x.y.z>` (or run it by hand) and
# release-ios.yml builds apps/regex-lab/crates/regex-lab-mobile, signs it,
# uploads it to TestFlight and attaches the .ipa to the tag's GitHub Release.
#
# It ships in the koine demo's App Store record (com.yipihey.koine), so it
# needs no App Store Connect setup of its own. The two apps share one version
# line there: TestFlight moves the phone to the highest version, so each
# release, of either app, takes a version above every build in the record
# (the demo reached 0.4.2; regex-lab's first current build is 0.5.0). A
# regex-lab build replaces the demo on the phone until a later demo release
# does the reverse.
name: release-regex-lab-ios

on:
  push:
    tags: ["regex-lab-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "CFBundleShortVersionString, x.y.z, above every build in the record (0.4.2 was the demo's last)"
        type: string
        default: "0.5.0"

permissions:
  contents: write

jobs:
  testflight:
    uses: ./.github/workflows/release-ios.yml
    with:
      crate: regex-lab-mobile
      workspace: apps/regex-lab
      bundle_id: com.yipihey.koine
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      release_tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
    secrets: inherit
