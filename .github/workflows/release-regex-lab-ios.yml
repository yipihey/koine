# regex-lab onto an iPhone: tag `regex-lab-v<x.y.z>` (or run it by hand) and
# release-ios.yml builds apps/regex-lab/crates/regex-lab-mobile, signs it,
# uploads it to TestFlight and attaches the .ipa to the tag's GitHub Release.
#
# It ships in the koine demo's App Store record (com.yipihey.koine), so it
# needs no App Store Connect setup of its own; its versions start at 0.2.0 so
# its builds never reuse a demo build's version and number. A regex-lab
# build replaces the demo on the phone until the next demo release does the
# reverse.
name: release-regex-lab-ios

on:
  push:
    tags: ["regex-lab-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "CFBundleShortVersionString, x.y.z (0.2.0 or later)"
        type: string
        default: "0.2.0"

permissions:
  contents: write

jobs:
  testflight:
    uses: ./.github/workflows/release-ios.yml
    with:
      crate: regex-lab-mobile
      workspace: apps/regex-lab
      bundle_id: com.yipihey.koine
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      release_tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
    secrets: inherit
