name: koine

on:
  push:
    # A `mobile*` branch runs the `ios` job so the lane can be watched before
    # main moves (docs/plan-koine-mobile.md M-D5).
    branches: [main, 'mobile*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --all-targets
      - name: "wasm32: the browser frontend"
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p koine-plot -p koine-dioxus -p koine-web --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: "run-check: the run convention fixture conforms"
        run: cargo run -q -p run-convention --bin run-check -- crates/run-convention/fixtures/good
      # An app links only what it names (docs/plan-koine-host.md H-D10): the
      # host without its optional parts, and with each alone, still builds and
      # its unit tests pass.
      - name: "The lean host: koine-host without default features"
        run: |
          cargo clippy -p koine-host --lib --tests --no-default-features -- -D warnings
          cargo clippy -p koine-host --lib --no-default-features --features tasks -- -D warnings
          cargo clippy -p koine-packages --lib --no-default-features -- -D warnings
          cargo clippy -p impress-layout-service -p impress-surface-service --lib --tests --no-default-features -- -D warnings
          cargo test -p koine-host --lib --no-default-features
      # The worked example (apps/regex-lab): its own workspace over this
      # checkout, sharing the target directory. Its verbs, its package, and
      # every public item of `regex` with a verb or a reasoned exclusion.
      - name: "apps/regex-lab: a library wrapped as an app"
        working-directory: apps/regex-lab
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          regex_dir=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "regex") | .manifest_path' | xargs dirname)
          ../../scripts/check-verb-coverage.sh --lib "$regex_dir" --service crates/regex-lab-service

  # Every gesture the tour offers, fired with a mouse and with a finger
  # against a fresh demo host, each judged by what the host then answers
  # (docs/plan-koine-affordances.md A-D5). The screenshots prove looks; this
  # proves that what is drawn can be done.
  gestures:
    name: gestures (mouse and touch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIOXUS_CLI_VERSION: 0.7.10
      PLAYWRIGHT_VERSION: 1.56.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Cache dx
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DIOXUS_CLI_VERSION }}
      - name: Install dioxus-cli
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version "$DIOXUS_CLI_VERSION" --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and its Chromium
        run: |
          npm install -g "playwright@$PLAYWRIGHT_VERSION"
          npx -y "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
      - name: Fire every gesture
        run: scripts/tests/gestures/run.sh

  # The app on an iPhone (docs/plan-koine-mobile.md M-D5, docs/mobile.md): build
  # crates/koine-demo-mobile for the simulator with `dx`, install and launch it,
  # and drive the host inside it from the runner. The Linux job cannot do this
  # (no Xcode, no WKWebView); it type-checks the crate without its `mobile`
  # feature as part of `cargo test --workspace`.
  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DIOXUS_CLI_VERSION: 0.7.10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: iOS simulator target
        run: rustup target add aarch64-apple-ios-sim
      - name: Cache dx
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DIOXUS_CLI_VERSION }}
      - name: Install dioxus-cli
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version "$DIOXUS_CLI_VERSION" --locked
      - name: Build the demo app for the simulator
        working-directory: crates/koine-demo-mobile
        run: dx build --platform ios --release --features mobile
      - name: Drive the app on a simulator
        run: |
          APP="$(ls -d target/dx/koine-demo-mobile/release/ios/*.app | head -n 1)"
          echo "built: $APP"
          scripts/tests/ios/run.sh --app "$APP" --bundle-id com.yipihey.koine
