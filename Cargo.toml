[workspace]
resolver = "2"
members = [
    "crates/impress-service-core",
    "crates/koine-store-overlay",
    "crates/koine-app-intents",
    "crates/impress-service-macros",
    "crates/impress-pane-query",
    "crates/impress-pane-query-compile",
    "crates/impress-item",
    "crates/impress-schema-ref-codegen",
    "crates/impress-layout",
    "crates/impress-surface",
    "crates/impress-verb-surface",
    "crates/koine",
    "crates/koine-style-file",
    "crates/koine-plot",
    "crates/koine-tui",
    "crates/koine-dioxus",
    "crates/koine-web",
    "crates/impress-fs-lock",
    "crates/impress-settings",
    "crates/surface-demo-service",
    "crates/impress-layout-service",
    "crates/impress-surface-service",
    "crates/impress-keymap",
    "crates/impress-scenario",
    "crates/impress-workflow",
    "crates/koine-store-memory",
    "crates/koine-store-dir",
    "crates/koine-store-conformance",
    "crates/koine-store",
    "crates/koine-mcp-host",
    "crates/koine-notebook",
    "crates/koine-agent",
    "crates/koine-packages",
    "crates/koine-tasks",
    "crates/koine-ai",
    "crates/koine-ai-apple",
    "crates/koine-host",
    "crates/koine-window",
    "crates/perf-service",
    "crates/impress-app-transport",
    "crates/capabilities-service",
    "crates/impress-tags",
    "crates/impress-flags",
    "crates/koine-triage",
    "crates/koine-collections",
    "crates/koine-settings-service",
    "crates/impress-scenario-service",
    "crates/impress-workflow-service",
    "crates/koine-embeddings",
    "crates/koine-memory",
    "crates/impress-helix",
    "crates/koine-package-format",
    "crates/koine-store-query",
    "crates/koine-store-spy",
    "crates/koine-providers",
    "crates/koine-plot-typst",
    "crates/koine-plot-matplotlib",
    "crates/koine-plot-veusz",
    "crates/koine-py",
    "crates/koine-demo-mobile",
    "crates/run-convention",
    "crates/koine-sources",
    "crates/koine-workspace-hack",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yipihey/koine"

[workspace.lints.rust]
# Keep unsafe operations explicit even inside an unsafe function.
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Accidental debug output and unfinished branches must not ship in a verb host.
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# The cargo-hakari workspace-hack crate: every member depends on it so every
# lane resolves one third-party feature set (plan-verb-pipeline-and-transport
# § Build cost, B4). Generated; `cargo hakari generate` rewrites it and
# `cargo hakari manage-deps` adds the line to a new member. Configured in
# .config/hakari.toml.
koine-workspace-hack = { path = "crates/koine-workspace-hack" }
# Shared dependencies across crates
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Parsing
nom = "7.1"
# Source highlighting for `impress-surface`'s `highlight` feature (the host
# enables it; the browser bundle does not). The pure-Rust regex engine: no onig.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
regex = "1.10"
lazy_static = "1.4"

# UniFFI for FFI bindings (optional).
# NO `cli` here: that feature makes `uniffi_bindgen` a normal dependency of the
# facade, so every library enabling `uniffi` linked the whole generator stack
# (askama, goblin, cargo_metadata, clap - 40 crates) in every profile and for
# all five Apple triples. The generator lives in ONE binary crate now,
# `crates/uniffi-bindgen`, which the build-xcframework scripts invoke.
uniffi = { version = "0.28", default-features = false }

# Test-only helpers shared by the runtime crates
tempfile = "3"

# Filesystem notifications (koine-store-dir `watch`): inotify on Linux, FSEvents on
# macOS; the polling and kqueue backends are not wanted.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# Async trait support (HTTP source plugins, service traits)
async-trait = "0.1"
# HTTP client (rustls so no OpenSSL dependency on macOS/Linux/CI)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# XML parsing (arXiv Atom feed, PubMed)
quick-xml = "0.38"
# HTTP mocking for source-client tests
mockito = "1"

# Internal workspace crates

# Standalone library crates (local dev, published to crates.io)
impress-keymap = { path = "crates/impress-keymap" }
impress-item = { path = "crates/impress-item" }
impress-schema-ref-codegen = { path = "crates/impress-schema-ref-codegen" }
impress-layout = { path = "crates/impress-layout" }
impress-pane-query = { path = "crates/impress-pane-query" }
impress-pane-query-compile = { path = "crates/impress-pane-query-compile" }
impress-surface = { path = "crates/impress-surface" }
impress-workflow = { path = "crates/impress-workflow" }
impress-verb-surface = { path = "crates/impress-verb-surface" }
koine = { path = "crates/koine" }
koine-style-file = { path = "crates/koine-style-file" }
koine-plot = { path = "crates/koine-plot" }
koine-tui = { path = "crates/koine-tui" }
koine-dioxus = { path = "crates/koine-dioxus" }
koine-web = { path = "crates/koine-web" }
impress-scenario = { path = "crates/impress-scenario" }
surface-demo-service = { path = "crates/surface-demo-service" }
# `tier-b` (the loopback client that drives a running app) is opt-in per member.
impress-layout-service = { path = "crates/impress-layout-service", default-features = false }
impress-surface-service = { path = "crates/impress-surface-service", default-features = false }
# default-features = false HERE, not at the call site: a member inheriting a
# workspace dependency can only add features, never remove them, so a member
# writing `default-features = false` is silently ignored (cargo warns, and
# says it may become a hard error). Consumers opt in to store/index/embedder.
impress-fs-lock = { path = "crates/impress-fs-lock" }
# The store backends and the suite that proves them the same store
# (docs/plan-koine-store.md).
koine-store-memory = { path = "crates/koine-store-memory" }
koine-store-dir = { path = "crates/koine-store-dir" }
koine-store-conformance = { path = "crates/koine-store-conformance" }
koine-store = { path = "crates/koine-store" }
koine-mcp-host = { path = "crates/koine-mcp-host" }
koine-host = { path = "crates/koine-host" }
# The research-OS kit every host links (docs/plan-koine-research-os.md).
koine-notebook = { path = "crates/koine-notebook" }
koine-agent = { path = "crates/koine-agent" }
# `http` (registries over HTTP) is opt-in per member.
koine-packages = { path = "crates/koine-packages", default-features = false }
# The task kernel (docs/plan-koine-ai-tasks.md). `runtime` is opt-in per
# member: a workspace dependency cannot turn a default feature off.
koine-tasks = { path = "crates/koine-tasks", default-features = false }
# The AI kernel (docs/plan-koine-ai-tasks.md AI-D1); features are opt-in per member.
koine-ai = { path = "crates/koine-ai", default-features = false }
koine-ai-apple = { path = "crates/koine-ai-apple" }
# Package digests (plan-koine-research-os P-D1).
sha2 = "0.10"
koine-window = { path = "crates/koine-window" }
# `--window` (koine-window): the system-browser fallback, and the optional native window.
webbrowser = "1"
wry = "0.53"
tao = "0.34"
impress-settings = { path = "crates/impress-settings" }
# The capability and performance verbs, the verb transport's client, and the
# Python module builder (docs/plan-koine-kit-moves.md KM1).
perf-service = { path = "crates/perf-service" }
impress-app-transport = { path = "crates/impress-app-transport" }
capabilities-service = { path = "crates/capabilities-service" }
impress-tags = { path = "crates/impress-tags" }
impress-flags = { path = "crates/impress-flags" }
koine-triage = { path = "crates/koine-triage" }
koine-sources = { path = "crates/koine-sources" }
koine-collections = { path = "crates/koine-collections" }
koine-settings-service = { path = "crates/koine-settings-service" }
impress-scenario-service = { path = "crates/impress-scenario-service" }
impress-workflow-service = { path = "crates/impress-workflow-service" }
koine-embeddings = { path = "crates/koine-embeddings", default-features = false }
koine-memory = { path = "crates/koine-memory" }
impress-helix = { path = "crates/impress-helix" }
koine-package-format = { path = "crates/koine-package-format" }
koine-store-query = { path = "crates/koine-store-query" }
koine-store-spy = { path = "crates/koine-store-spy" }
koine-store-overlay = { path = "crates/koine-store-overlay" }
koine-app-intents = { path = "crates/koine-app-intents" }
koine-providers = { path = "crates/koine-providers" }
koine-plot-typst = { path = "crates/koine-plot-typst" }
koine-plot-matplotlib = { path = "crates/koine-plot-matplotlib" }
koine-plot-veusz = { path = "crates/koine-plot-veusz" }
koine-py = { path = "crates/koine-py" }

# implore crates

# Scientific data I/O (for implore)
hdf5 = "0.8"
fitsio = "0.21"
# `arrow` is in parquet's default feature set and pulls arrow-array/-cast/-ipc/
# -select, flatbuffers and the lexical-* family (~16 crates) for a reader that
# only uses `parquet::record` - the row API. Codecs are kept, brotli included,
# so existing files still read.
parquet = { version = "53", default-features = false, features = ["snap", "zstd", "flate2", "lz4", "brotli", "base64"] }
csv = "1.3"

# URL handling
url = "2"
urlencoding = "2"

# N-dimensional arrays (for implore volumetric data)
ndarray = "0.16"

# NPZ/NPY file reading (for implore)
npyz = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Linear algebra (for implore RG computations)
nalgebra = "0.33"

# Parallel processing
rayon = "1.10"

# Plotting (for implore)
kuva = "0.1"
# SVG → PNG for a figure's stored artifact (implore-core figure_artifact).
# Already in the tree through typst-pdf → krilla-svg; no raster-image
# decoders, because implore's SVG embeds none.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

# Typst rendering (for implore lilaq backend + imprint)
typst = "0.14"
typst-pdf = "0.14"
typst-svg = "0.14"
typst-as-lib = { version = "0.15", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

# impel crates

# impel dependencies
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "backup"] }
ratatui = "0.29"
crossterm = "0.28"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Bridges any remaining `log` caller (a dependency; G7a moved the workspace's
# own `log`-facade crates onto `tracing`, D-P1) into whatever `tracing`
# subscriber is installed — `impress-store-ffi`'s bridge layer calls
# `LogTracer::init()`.
tracing-log = "0.2"

# Persona/config loading
toml = "0.8"
dirs = "6"

# impress-service-* (Phase 0 codegen pipeline)
impress-service-core = { path = "crates/impress-service-core" }
impress-service-macros = { path = "crates/impress-service-macros" }
inventory = "0.3"
# koine-py `python` feature. `extension-module` is the cdylib's choice, not the rlib's.
pyo3 = "0.23"
pythonize = "0.23"
schemars = { version = "0.8", features = ["uuid1"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

# Auto-generated CLI binaries (imbib-cli, imprint-cli) — clap built from
# CliSubcommand inventory entries registered by `#[impress_service]`.
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }

# HTTP transport for the unified storage (Phase A/B/C from we-are-planning-…).

# Dev/test debug info. macOS defaults to `split-debuginfo = "unpacked"`, which
# means rustc KEEPS every codegen unit's `.o` file next to the rlib whenever
# debuginfo is on - that is where DWARF lives. With ~1,080 registry crates and
# one flat `target/debug/deps`, those objects reached 1,223,708 files, and a
# directory that size costs 40-70 SECONDS to launch a test binary out of (same
# bytes one directory up: 1.7s). A 4-package test run is 21 such launches, which
# is where ~55 minutes of a measured 58m49s job went - against 3m06s of
# compiling and 28.8s of actual tests.
#
# `debug = false` for dependencies stops the retention for every registry crate
# (rustc keeps the objects only when debuginfo is enabled); members keep
# line tables, so backtraces still resolve to file:line in our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# `[profile.test]` inherits dev, so test binaries get the same treatment.
#
# Release is NOT incremental: it used to be, to speed the framework-rebuild
# loop, but incremental applies only to workspace members while the shipped
# binaries (impress-mcp, imprint, impress, impel-taskd - signed out of
# target/release) paid 256-way codegen-unit partitioning for it. The framework
# scripts set CARGO_INCREMENTAL=1 for themselves instead; they build into
# target/<triple>/release, which the shipped binaries never share.
