[package]
name = "koine-host"
description = "The koine host: serves the verb inventory, generated surfaces, the layout, the page and MCP from one process, over a store opened from a URL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "koine_host"
path = "src/lib.rs"

[[bin]]
name = "koine-host"
path = "src/main.rs"
# The binary is the demo host: the tour's verbs and surfaces.
required-features = ["demo"]

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
impress-service-core = { workspace = true }
impress-item = { workspace = true }
impress-pane-query = { workspace = true }
impress-layout = { workspace = true, features = ["schema"] }
impress-layout-service = { workspace = true }
impress-surface-service = { workspace = true }
# Source highlighting: the resolver fills `code` spans; the browser bundle never
# enables this (plan-koine-tree-stream T-D5).
impress-surface = { workspace = true, features = ["highlight"] }
impress-verb-surface = { workspace = true }
koine-store = { workspace = true }
koine-mcp-host = { workspace = true }
# The research-OS kit every host links (docs/plan-koine-research-os.md): the
# call log and notebook, the agent desk and skill, packages and shipped surfaces.
koine-notebook = { workspace = true }
koine-agent = { workspace = true }
# `<host> app-intents` (plan-koine-trust TR-D14).
koine-app-intents = { workspace = true }
koine-packages = { workspace = true }
# Tasks and AI (docs/plan-koine-ai-tasks.md Q-D5, AI-D5): the `tasks` and `ai`
# features (docs/plan-koine-host.md H-D10).
koine-tasks = { workspace = true, features = ["runtime"], optional = true }
koine-ai = { workspace = true, features = ["executor"], optional = true }
# The memory verbs, text search only: the desk agent recalls (KM-D6).
koine-memory = { workspace = true, features = ["package"] }
# Get, browse, search and relate any item (KM9).
koine-store-query = { workspace = true }
# Review and trust runtime providers (KM12).
koine-providers = { workspace = true }
# The source convention's verbs (docs/plan-source-convention.md S-D3): always
# linked; the adapters are packages behind `sources` (Crossref, arXiv, ADS and
# OpenAlex; they bring reqwest, which a `default-features = false` host leaves out, H-D10).
source-service = { workspace = true }
source-crossref = { workspace = true, optional = true }
source-arxiv = { workspace = true, optional = true }
source-ads = { workspace = true, optional = true }
source-openalex = { workspace = true, optional = true }
source-pubmed = { workspace = true, optional = true }
source-wos = { workspace = true, optional = true }
source-scix = { workspace = true, optional = true }
source-s2 = { workspace = true, optional = true }
source-dblp = { workspace = true, optional = true }
source-inspire = { workspace = true, optional = true }
# The run convention's verbs (docs/plan-run-convention.md R-D13): always
# linked; the only code it knows out of the box is `demo-code` when that
# binary is beside the host's.
run-service = { workspace = true }
# The demo verbs the binary links (the library itself names no domain): the
# `demo` feature.
surface-demo-service = { workspace = true, optional = true }
koine-window = { workspace = true }
# Apple Foundation Models as a native provider (`--features apple-fm`; adds a
# Swift build, macOS only; docs/plan-koine-local-models.md LM-D5).
koine-ai-apple = { workspace = true, optional = true }
koine-workspace-hack.workspace = true

[features]
# What an app links beyond the core and the research kit (docs/plan-koine-host.md
# H-D10). The defaults are the demo host's; an app writes
# `default-features = false` and names what it needs (scripts/new-app.sh --with).
default = ["ai", "tasks", "http-registries", "tier-b", "demo", "sources"]
# The task scheduler and the task-service verbs (`--tasks`).
tasks = ["dep:koine-tasks"]
# The model executors, the desk agent and the impress-ai-service verbs (`--ai`).
ai = ["tasks", "dep:koine-ai"]
# Package registries over HTTP(S); without it a registry is a file or a path.
http-registries = ["koine-packages/http"]
# The layout and surface selftests' Tier B: a loopback HTTP client that drives
# a running app. Without it tier `b` reports one skipped capability.
tier-b = ["impress-layout-service/tier-b", "impress-surface-service/tier-b"]
# The demo verbs and the tour, for the koine-host binary.
demo = ["dep:surface-demo-service"]
# The online-source adapters `bib-source-service_explain` lists: Crossref, arXiv,
# ADS, OpenAlex, PubMed, Web of Science, SciX, Semantic Scholar, DBLP and
# INSPIRE-HEP
# (docs/plan-source-convention.md S-D9). Without it the six source verbs are
# linked over an empty inventory.
sources = ["dep:source-crossref", "dep:source-arxiv", "dep:source-ads", "dep:source-openalex", "dep:source-pubmed", "dep:source-wos", "dep:source-scix", "dep:source-s2", "dep:source-dblp", "dep:source-inspire"]
# A native `--window` (webkit2gtk on Linux); without it `--window` opens the browser.
window-webview = ["koine-window/webview"]
# The on-device Apple model as a provider. Off by default: it builds a Swift
# package, and the binary then needs macOS 26 or later.
apple-fm = ["ai", "dep:koine-ai-apple"]

# The integration tests drive the demo verbs.
[[test]]
name = "host"
required-features = ["demo"]

[dev-dependencies]
reqwest = { workspace = true }
# koine's own effects check (tests/effects.rs, KM14).
koine-store-spy = { workspace = true }
koine-store-memory = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
impress-surface = { workspace = true, features = ["schema"] }
tokio = { workspace = true }

[lints]
workspace = true
