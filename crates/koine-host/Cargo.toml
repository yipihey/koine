[package]
name = "koine-host"
description = "The koine host: serves the verb inventory, generated surfaces, the layout, the page and MCP from one process, over a store opened from a URL"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "koine_host"
path = "src/lib.rs"

[[bin]]
name = "koine-host"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
impress-service-core = { workspace = true }
impress-item = { workspace = true }
impress-pane-query = { workspace = true }
impress-layout = { workspace = true, features = ["schema"] }
impress-layout-service = { workspace = true }
impress-surface-service = { workspace = true }
# Source highlighting: the resolver fills `code` spans; the browser bundle never
# enables this (plan-koine-tree-stream T-D5).
impress-surface = { workspace = true, features = ["highlight"] }
impress-verb-surface = { workspace = true }
koine-store = { workspace = true }
koine-mcp-host = { workspace = true }
# The research-OS kit every host links (docs/plan-koine-research-os.md): the
# call log and notebook, the agent desk and skill, packages and shipped surfaces.
koine-notebook = { workspace = true }
koine-agent = { workspace = true }
koine-packages = { workspace = true }
# Tasks and AI (docs/plan-koine-ai-tasks.md Q-D5, AI-D5).
koine-tasks = { workspace = true, features = ["runtime"] }
koine-ai = { workspace = true, features = ["executor"] }
# The memory verbs, text search only: the desk agent recalls (KM-D6).
koine-memory = { workspace = true }
# The demo verbs the binary links (the library itself names no domain).
surface-demo-service = { workspace = true }
koine-window = { workspace = true }
# Apple Foundation Models as a native provider (`--features apple-fm`; adds a
# Swift build, macOS only; docs/plan-koine-local-models.md LM-D5).
koine-ai-apple = { workspace = true, optional = true }
koine-workspace-hack.workspace = true

[features]
# A native `--window` (webkit2gtk on Linux); without it `--window` opens the browser.
window-webview = ["koine-window/webview"]
# The on-device Apple model as a provider. Off by default: it builds a Swift
# package, and the binary then needs macOS 26 or later.
apple-fm = ["dep:koine-ai-apple"]

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
impress-surface = { workspace = true, features = ["schema"] }
tokio = { workspace = true }

[lints]
workspace = true
