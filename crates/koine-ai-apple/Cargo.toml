[package]
name = "koine-ai-apple"
description = "Apple Foundation Models as a native koine-ai provider: a Swift package linked statically behind a C ABI of JSON strings and callbacks (docs/plan-koine-local-models.md LM-D5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
async-trait = { workspace = true }
koine-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tokio-stream = "0.1"
uuid = { workspace = true }
tracing = { workspace = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
