[package]
name = "koine-agent"
description = "The agent desk and the generated skill: what a person leaves for an agent, and what an agent reads to learn the app (docs/plan-koine-research-os.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-service-core = { workspace = true }
impress-service-macros = { workspace = true }
impress-item = { workspace = true }
impress-pane-query = { workspace = true }
koine-store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
# The desk test records its calls through the notebook's sink.
koine-notebook = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
koine-store-memory = { workspace = true }
impress-surface = { workspace = true }
impress-layout-service = { workspace = true }
impress-surface-service = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
