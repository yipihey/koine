[package]
name = "koine-sources"
description = "The source convention's vocabulary: the bibliographic-work kind, the explain record, the bib.* query grammar and its diagnostics (docs/plan-source-convention.md S1). Types only: no HTTP, no adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-item = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true
