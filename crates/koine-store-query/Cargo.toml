[package]
name = "koine-store-query"
description = "Store-generic reads over the store port: grouped search, relations both ways, get and browse any item (docs/plan-koine-kit-moves.md KM9)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The kernels (`ops`) are always there; `service` adds the verbs. A crate that
# wants only the kernels (impress-core) turns it off.
default = ["service"]
service = [
    "dep:impress-service-core",
    "dep:impress-service-macros",
    "dep:koine-store",
    "dep:serde",
    "dep:schemars",
    "dep:async-trait",
]

[dependencies]
impress-item = { workspace = true }
serde_json = { workspace = true }
impress-service-core = { workspace = true, optional = true }
impress-service-macros = { workspace = true, optional = true }
koine-store = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
schemars = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
koine-store-memory = { workspace = true }
koine-store-dir = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

[[test]]
name = "backends"
required-features = ["service"]
