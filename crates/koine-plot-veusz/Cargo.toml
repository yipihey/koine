[package]
name = "koine-plot-veusz"
description = "A koine-plot renderer that writes a Veusz document (.vsz), and with exec exports it through the person's veusz to PNG, PDF or SVG (docs/plan-koine-kit-moves.md KM-D13)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Export with the person's own `veusz` (`veusz --export`). Off: the renderer
# writes the document only.
exec = ["dep:tempfile"]

[dependencies]
koine-plot = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
koine-workspace-hack.workspace = true

[lints]
workspace = true
