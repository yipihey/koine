[package]
name = "koine-store"
description = "The koine store port by name: re-exports impress-item and opens a backend from a URL (memory:, dir:<path>)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-item = { workspace = true }
koine-store-memory = { workspace = true }
koine-store-dir = { workspace = true }
koine-store-overlay = { workspace = true }
thiserror = { workspace = true }
# `process`: the pipeline's call-scoped store, and the subtree resolver trait.
impress-service-core = { workspace = true }
impress-pane-query-compile = { workspace = true }
# `once`: the durable idempotency store (plan-koine-trust TR-D1).
uuid = { workspace = true, features = ["v5"] }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
koine-workspace-hack.workspace = true

[lints]
workspace = true
