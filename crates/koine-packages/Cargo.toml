[package]
name = "koine-packages"
description = "Shipped surfaces with baselines (reset, diff, three-way upgrade) and reviewed packages (docs/plan-koine-research-os.md B-D, P-D)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The format itself: manifest, Package, bundle, digest (KM7).
koine-package-format = { workspace = true }
impress-service-core = { workspace = true }
impress-service-macros = { workspace = true }
impress-item = { workspace = true }
koine-store = { workspace = true }
# A spec is compared in the form the surface store keeps it: parsed as a
# SurfaceSpec and serialized again.
impress-surface = { workspace = true }
# Workflows a package ships (docs/plan-koine-ai-tasks.md P-D9).
impress-workflow = { workspace = true }
# The kit's surfaces (plan-koine-research-os B-D4).
koine-notebook = { workspace = true }
koine-agent = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
# Fetching registry indexes and bundles over HTTP(S) (P-D5).
reqwest = { workspace = true }
tracing = { workspace = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
# The categories a package declares, read the way the AI kernel reads them.
koine-ai = { workspace = true }
impress-pane-query = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
koine-store-memory = { workspace = true }
impress-surface-service = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
