[package]
name = "koine-packages"
description = "Shipped surfaces with baselines (reset, diff, three-way upgrade) and reviewed packages (docs/plan-koine-research-os.md B-D, P-D)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-service-core = { workspace = true }
impress-service-macros = { workspace = true }
impress-item = { workspace = true }
koine-store = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
koine-store-memory = { workspace = true }
impress-surface = { workspace = true }
impress-surface-service = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
