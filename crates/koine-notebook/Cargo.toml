[package]
name = "koine-notebook"
description = "The lab notebook over the call log: a store sink for call records, runs, and the notebook verbs and surface (docs/plan-koine-notebook.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
impress-service-core = { workspace = true }
impress-service-macros = { workspace = true }
impress-item = { workspace = true }
koine-store = { workspace = true }
koine-plot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
chrono = { workspace = true }
tracing = { workspace = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
koine-store-memory = { workspace = true }
impress-surface = { workspace = true }

[lints]
workspace = true
