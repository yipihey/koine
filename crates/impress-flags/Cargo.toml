[package]
name = "impress-flags"
description = "Flag (workflow state) models, parsing, and query for impress apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "impress-flags"
path = "src/main.rs"

[features]
default = []
ffi = ["dep:uniffi"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uniffi = { workspace = true, optional = true }
koine-workspace-hack.workspace = true

[dev-dependencies]
rstest = "0.18"

[lints]
workspace = true
